name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sishi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sishi
      SESSION_SECRET: ci-session-secret-must-be-at-least-32-chars
      THIRD_PARTY_JWT_SECRET: ci-third-party-jwt-hmac-secret-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      VITEST_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema sync
        run: npx prisma db push

      - name: Unit & integration tests
        run: npm run test

      - name: Production build
        run: npm run build
