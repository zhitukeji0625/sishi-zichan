# 本地 / CI 集成测试用 MySQL（与生产 schema 一致）
name: sishi-zichan-test

services:
  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: testroot
      MARIADB_DATABASE: sishi
    ports:
      - "13306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
