[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sishi-zichan"
version = "0.1.0"
description = "Asset utilities (minimal package for tests)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sishi_zichan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
