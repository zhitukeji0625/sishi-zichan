[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sishi-zichan"
version = "0.1.0"
description = "资产相关小工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["sishi_zichan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
