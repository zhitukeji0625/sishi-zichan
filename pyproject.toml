[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sishi-zichan"
version = "0.1.0"
description = "Placeholder package with a minimal health-check API."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/sishi_zichan"]

[tool.hatch.build.targets.sdist]
include = ["src/sishi_zichan", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
