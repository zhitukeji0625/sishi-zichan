[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sishi-zichan"
version = "0.1.0"
description = "资产相关工具与校验"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sishi_zichan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
